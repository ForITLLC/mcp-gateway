[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "forit-mcp-gateway"
version = "0.1.1"
description = "A branded, authenticated OpenAPI-to-MCP gateway maintained by ForIT"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "ForIT LLC"}]
dependencies = ["fastmcp==3.2.3", "httpx>=0.28,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "build>=1.2,<2"]

[project.scripts]
forit-mcp-gateway = "forit_mcp_gateway.__main__:main"

[project.urls]
Repository = "https://github.com/ForITLLC/mcp-gateway"
Issues = "https://github.com/ForITLLC/mcp-gateway/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Enumerate the public release surface; local deployment files cannot enter an sdist.
[tool.hatch.build.targets.sdist]
only-include = [
  "src/forit_mcp_gateway",
  "tests/test_gateway.py",
  "tests/test_login_branding.py",
  "examples/catalog_api.py",
  "examples/check_client.py",
  "examples/gateway.json",
  "scripts/check_public_files.py",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "Dockerfile",
  ".dockerignore",
]

[tool.hatch.build]
exclude = [
  "**/clients/**", "**/config/**", "**/configs/**", "**/local/**",
  "**/private/**", "**/manifests/**", "**/infra/**",
  "**/.env*", "**/*.local.*", "**/*.pem", "**/*.key",
  "**/*.p12", "**/*.pfx", "**/*.sqlite*", "**/*.db",
  "**/__pycache__/**", "**/*.pyc",
]
